[workspace]
resolver = "2"
members = [
    "crates/ascii_core",
    "crates/ascii_render",
    "crates/ascii_io",
    "crates/ascii_app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ElAjbariYoussef <youssefelajbari@gmail.com>"]

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
crc32fast = "1.4"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5.0"
rfd = "0.15"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
