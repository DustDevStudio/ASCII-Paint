
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Version getter
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.version }}
      tag: ${{ steps.read_version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from file
        id: read_version
        run: |
          VERSION=$(cat version | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ascii_app
            asset_name: ascii_paint-x86_64-unknown-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: ascii_app
            asset_name: ascii_paint-x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ascii_app
            asset_name: ascii_paint-aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ascii_app.exe
            asset_name: ascii_paint-x86_64-pc-windows-msvc.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --bin ascii_app

      - name: Stage binary asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" \
              --format='%H%x09%h%x09%s' > commits.txt
          else
            git log -n 25 \
              --format='%H%x09%h%x09%s' > commits.txt
          fi

          echo "## Commits" > release_notes.md
          echo "" >> release_notes.md

          : > authors.txt

          while IFS=$'\t' read -r SHA SHORT SUBJECT; do
            [ -n "$SHA" ] || continue

            # Resolve the commit author to their GitHub username.
            USERNAME=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${SHA}" \
              --jq '.author.login // empty' 2>/dev/null || true)

            if [ -n "$USERNAME" ]; then
              AUTHOR="@$USERNAME"
              echo "$USERNAME" >> authors.txt
            else
              AUTHOR=$(git show -s --format='%an' "$SHA")
              # Fall back to the commit author name if no
              # associated GitHub account can be resolved.
              echo "$AUTHOR" >> authors.txt
            fi

            printf -- '- %s (%s) by %s\n' \
              "$SUBJECT" "$SHORT" "$AUTHOR" >> release_notes.md
          done < commits.txt

          echo "" >> release_notes.md
          echo "### Authors" >> release_notes.md

          if [ -s authors.txt ]; then
            sort -fu authors.txt | while IFS= read -r AUTHOR; do
              if [[ "$AUTHOR" =~ ^[a-zA-Z0-9-]+$ ]]; then
                printf -- '- @%s\n' "$AUTHOR"
              else
                printf -- '- %s\n' "$AUTHOR"
              fi
            done >> release_notes.md
          else
            echo "- No commits found." >> release_notes.md
          fi

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            --latest \
            artifacts/*/*

      - name: Create and push release branch
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git push origin "HEAD:refs/heads/$TAG"
